<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#1a1a0a;font-family:system-ui;color:#f9ca24;padding:20px}
h2{font-size:18px;margin:0 0 12px}
.grid{display:flex;flex-wrap:wrap;gap:6px}
.cell{width:90px;text-align:center}
.cell img{width:90px;height:90px;object-fit:contain;background:#1a1a0a;border-radius:4px;border:1px solid rgba(249,202,36,0.2)}
.cell .n{font-size:11px;color:rgba(253,246,227,0.5);margin-top:2px}
</style></head><body>
  <h2>v4 视频抽帧（51帧 @10fps）</h2>
  <div class="grid" id="grid"></div>
<script>
let html='';
for(let i=1;i<=51;i++){
  const n=i<100?'0'+i:i;
  html+='<div class="cell"><img src="v4-frames/f'+n+'.png"><div class="n">#'+i+'</div></div>';
}
document.getElementById('grid').innerHTML=html;
</script>
</body></html>
