<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#1a1a0a;font-family:system-ui;color:#f9ca24;display:flex;flex-direction:column;align-items:center;padding:24px}
h2{font-size:20px;margin:8px 0 6px}
.hint{font-size:12px;color:rgba(253,246,227,0.45);margin-bottom:16px}
.stage{width:480px;height:320px;background:#000;border:1px solid rgba(249,202,36,0.12);border-radius:12px;overflow:hidden}
.stage video{width:100%;height:100%;object-fit:contain}
.controls{margin-top:14px;display:flex;gap:14px;align-items:center}
button{background:#f9ca24;color:#1a1a0a;border:0;border-radius:24px;padding:12px 32px;font-size:18px;font-weight:bold;cursor:pointer}
button:active{transform:scale(0.95)}
</style></head><body>
  <h2>磕头动画 · Wan2.2 视频生成版</h2>
  <div class="hint">T2V 文本生成视频，5秒 480p。点击播放/循环</div>
  <div class="stage">
    <video id="v" src="kowtow-video-v4.mp4" autoplay loop muted playsinline></video>
  </div>
  <div class="controls">
    <button onclick="toggle()">播放/暂停</button>
    <button onclick="document.getElementById('v').currentTime=0">重头播</button>
  </div>
<script>
const v=document.getElementById('v');
function toggle(){ if(v.paused) v.play(); else v.pause(); }
</script>
</body></html>
